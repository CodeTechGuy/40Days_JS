<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closure</title>
</head>
<body>
    <button id = "orange">Orange</button>
    <button id = "green">Green</button>
</body>

<script>
    function closure(color){
        return function(){
            document.body.style.backgroundColor = `${color}`;
        }
    }
    document.getElementById("orange").onclick = closure("orange");
    document.getElementById("green").onclick = closure("green");
</script>
</html>
