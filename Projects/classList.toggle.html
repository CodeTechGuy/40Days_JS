<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classList.toggle("class-name")</title>
    <style>
        .bClass {
            background-color: black;
            color: #fff;
        }
        .btn{
            /* border: 2px solid white; */
            border-radius: 10px;
            /* background-color: black;
            color: white; */
        }
    </style>
</head>
<body class="bClass">
    <h1>This is a toggle usage project</h1>
    <button onclick="togglefnc()" class="btn">Toggle</button>


    <script>
        const body = document.querySelector("body");
        const btn = document.querySelector("button");
        console.log(body)
        console.log(btn)

        function togglefnc(){
            body.classList.toggle("bClass");
            btn.classList.toggle("bClass");
        }
    </script>
</body>
</html>
